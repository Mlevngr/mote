name: Validate Android and publish releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version and tag
        id: version
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -v
          version=$(sed -n 's/^versionName=//p' version.properties)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          python3 scripts/release.py check --tag "$tag" --history
          test -f "docs/releases/$version.md"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/existing-release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            404) ;;
            200) echo "::error::Release already exists; publish a new version instead"; exit 1 ;;
            *) echo "::error::Cannot verify release existence (HTTP $status)"; exit 1 ;;
          esac

      - name: Test, lint and build app plus plugin APKs
        run: ./gradlew --build-cache testDebugUnitTest lintDebug assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify and package release assets
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.name }}"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            # A temporary local tag exercises packaging before a public tag is created.
            # Never move an existing local or remote release tag.
            git tag "$tag"
          fi
          python3 scripts/release.py package --tag "$tag"

      - name: Start disposable API 35 emulator
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/android-user
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n mote-ci \
            --path "$ANDROID_AVD_HOME/mote-ci.avd" -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          test -f "$ANDROID_AVD_HOME/mote-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx mote-ci
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd mote-ci -no-window -no-audio -no-snapshot \
            -no-boot-anim -accel on -gpu swiftshader -memory 2048 \
            < /dev/null > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Device gesture and viewport smoke tests
        env:
          ANDROID_SERIAL: emulator-5554
          SMOKE_LOG: ${{ runner.temp }}/editor-smoke.log
        run: scripts/device-smoke.sh --skip-build

      - name: Annotate device failures
        if: failure()
        shell: bash
        run: |
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d -b crash \
            > "$RUNNER_TEMP/device-crash.log" 2>&1 || true
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['emulator.log', 'editor-smoke.log', 'device-crash.log']:
              path = Path(os.environ['RUNNER_TEMP']) / name
              if path.exists():
                  message = '\n'.join(path.read_text(errors='replace').splitlines()[-60:])
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{message}')
          PYTHON

      - name: Archive device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-evidence-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/editor-smoke.log
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/device-crash.log
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Archive verified assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ steps.version.outputs.name }}.md
          files: build/release/*
          fail_on_unmatched_files: true

      - name: Stop emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
