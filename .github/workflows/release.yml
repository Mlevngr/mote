name: Build Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build app plus plugin APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Mote-${GITHUB_REF_NAME#v}.apk"
          cp plugins/ai-organizer/build/outputs/apk/release/ai-organizer-release.apk "Mote-AI-Organizer-1.0.0.apk"
          cp plugins/local-organizer/build/outputs/apk/release/local-organizer-release.apk "Mote-Local-Organizer-1.0.0.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: Mote-*.apk
