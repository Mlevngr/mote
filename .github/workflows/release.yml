name: Build Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source and version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version and tag
        id: version
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release.py check --tag "$GITHUB_REF_NAME" --history
          test -f "docs/releases/${GITHUB_REF_NAME#v}.md"
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/existing-release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            404) ;;
            200) echo "::error::Release already exists; publish a new version instead"; exit 1 ;;
            *) echo "::error::Cannot verify release existence (HTTP $status)"; exit 1 ;;
          esac

      - name: Test, lint and build app plus plugin APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify and package release assets
        run: python3 scripts/release.py package --tag "$GITHUB_REF_NAME"

      - name: Archive verified assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ steps.version.outputs.name }}.md
          files: build/release/*
          fail_on_unmatched_files: true
